# Electron 打包配置（MIGRATION_SPEC §6.5）
#
# 关键决策：
#  - asar: false —— 本地服务是 ELECTRON_RUN_AS_NODE 子进程，worker/ 下的 Python 文件
#    也必须以真实文件路径被读取/上传，打进 asar 后无法直接使用；
#  - files 用白名单，只带运行必需目录（源码、测试、文档、构建脚本不进安装包）；
#  - 图标资产由 tools/build-icons.py 生成：icon.ico（Windows 16~256）、
#    icon.icns（macOS 16~1024）、icon.png（1024，托盘与 Linux/macOS 兜底）。

appId: com.nanxfu.aigcstudio
productName: AIGC Studio
copyright: Copyright © 2026 nanxfu

directories:
  output: release

# GitHub Releases 发布配置（M2.8 阶段 A）：
#  - publish 的核心作用是让 electron-builder 生成 resources/app-update.yml 与 latest.yml；
#  - 首个版本先以 Draft 发布，人工核对资产后再转正式 Release；
#  - 只做 stable 通道，不生成 beta 等无人消费的更新清单。
publish:
  provider: github
  owner: nanxfu
  repo: aigc-studio
  releaseType: draft
generateUpdatesFilesForAllChannels: false

asar: false
beforePack: ./tools/prepare-local-gpu-engine.mjs
npmRebuild: false
# 复用已安装的 Electron 发行目录（node_modules/electron/dist），避免 electron-builder 重新下载
# 约 100MB 的 Electron zip；版本仍由 package.json 的 devDependencies 决定。
electronDist: node_modules/electron/dist

files:
  - package.json
  - build/icon.png
  - build/icon.ico
  - electron/**
  - server/**
  - shared/**
  - models/**
  - worker/**
  - mcp/**
  - dist/web/**
  # 工坊 L2 视觉感知：onnxruntime-web 的 Node ESM 入口与单线程 WASM 必须以真实文件
  # 随包分发（asar: false），首次感知时再用 file:// 路径加载；不携带模型权重。
  - node_modules/onnxruntime-web/package.json
  - node_modules/onnxruntime-web/dist/ort.node.min.mjs
  - node_modules/onnxruntime-web/dist/ort.node.min.js
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm
  - licenses/stable-diffusion.cpp-MIT.txt
  - '!**/*.map'
  - '!**/__pycache__/**'
  - '!**/*.pyc'
  - '!**/.DS_Store'

win:
  icon: build/icon.ico
  extraResources:
    - from: .tmp/local-gpu/engine/
      to: local-gpu
    - from: .tmp/local-gpu/licenses/
      to: licenses/stable-diffusion.cpp
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${name}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AIGC Studio
  # 差分更新依赖 .blockmap；显式声明，避免未来默认值变化后静默退化为全量下载。
  # 当前 asar: false，没有 app.asar 可存，不需要 "store-asar"。
  differentialPackage: true

portable:
  artifactName: ${name}-${version}-portable.${ext}

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.graphics-design

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Graphics
  artifactName: ${name}-${version}-${arch}.${ext}
